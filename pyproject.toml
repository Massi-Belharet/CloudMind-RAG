[project]
name = "cloudmind-rag"
version = "1.0.0"
description = "cloudmind-rag project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "langchain-core>=1.3.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.8.3",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "torch>=2.6.0",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["src*"]

